    <body>
        <h1>Login</h1>
        <form method="post" action="https://formtester.goodbytes.be/post.php">
            <div>
                <label for="uid">User ID:</label>
                <input type="text" id="uid" name="User ID">
            </div>
            <div>
                <label for="upwd">Password:</label>
                <input type="password" id="upwd" name="password">
            </div>
            <div>
                <span><strong>Campus</strong></span>
                <div>
                    <input type="radio" id="ad" name="campus" value="Abu Dhabi">
                    <label for="ad">Abu Dhabi</label>
                </div>
                <div>
                    <input type="radio" id="db" name="campus" value="Dubai">
                    <label for="db" >Dubai</label>
                </div>
            </div>
            <br>
            <input type="submit" value="Log In">
        </form>
    </body>
