<html>
  <head>
    <link href="main.css" rel="stylesheet">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
  </head>
  <body>
    <h2 style="font-size: 4vw;">HTML Forms Exercise</h2>

    <form method="post" action="https://formtester.goodbytes.be/post.php">
      <p>
        <label for="name">Name:</label>
        <input type="text" size="25" id="name" name="name">
      </p>

      <p>
        <label for="comments">Comments:</label>
        <textarea type="text" rows = "4" cols = "36" id="comments" name="comments">
        </textarea>
      </p>

      <p>
        <label for="email">Email Address:</label>
        <input type="text" size="25" id="email" name="email">
      </p>
      <fieldset>
      <legend>How did you get to our site?</legend>
      <input type="radio" name="1"> Search engine <br>
      <input type="radio" name="2"> Links from another site<br>
      <input type="radio" name="3"> deitel.com Web site<br>
      <input type="radio" name="4"> Reference in a book<br>
      <input type="radio" name="5"> Other
      </fieldset>
      <br>
      <input type="submit" value="Send">
    </form>
  </body>
</html>
